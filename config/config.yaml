whi_custom_interaction_example:
  ros__parameters:
    # WebSocket 连接配置
    websocket_uri: "ws://10.66.20.92:5566/robot?robotId=001"
    
    # 硬件接口配置 (Modbus RTU)
    hardware_interface:
      device_addr: 0x02          # Modbus设备地址
      port: "/dev/ttyUART_485_2"    # 串口设备路径
      baudrate: 9600          # 波特率
    
    # 初始状态配置文件路径
    init_levels: "/home/nvidia/ros2_ws/src/whi_custom_interaction_example/config/init_levels.yaml"
    
    # 云台(PTZ)设备配置
    ptz:
      device_ip: "192.168.254.7"    # 海康威视云台IP地址
      device_port: 8000             # 设备端口
      username: "admin"             # 登录用户名
      password: "jy100200300"       # 登录密码
      channel: 1                    # 通道号
      debug_mode: false             # 调试模式开关
    
  
